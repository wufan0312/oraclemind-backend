# Alembic config for OracleMind backend database migrations.
#
# P1 defect-report improvement: introduce Alembic to replace create_all + hand-written
# ALTER migrations, giving trackable, rollbackable schema management.
#
# sqlalchemy.url is intentionally left blank and injected by migrations/env.py from
# app.core.config.settings, so switching SQLite (dev) / PostgreSQL (prod) only needs
# a change in .env DATABASE_URL.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
